# Parameter library for built-in models.
#
# Each model has one or more parameter sets under [models.<model_name>.<key>].
# Parameter spec fields:
#   transform = "softplus" | "bounded" | "tanh" | "linear" | "identity"
#   bounds = [low, high] (for bounded)
#   scale / offset = numeric
#   unit = string (required)
#   trainable = false to hold constant with "value"
#   value = fixed value when trainable = false
#   init = initial value in constrained/physical units.
#   init_raw = initial value in unconstrained/raw space (available for explicit raw-coordinate starts).
#   scale_key / bounds_scale_key / init_scale_key = context keys that model factories can override.
#
# Pool-based models define pool specs under [models.<model_name>.pools.<pool_name>].
# Pool specs map parameter names to the same spec dicts and can include:
#   rate_key (ab_mt_n), enable_mt_offset (ab_mt_n), line_shape (ab_mt_n)
# Defaults (e.g., default pool order) live in [models.<model_name>.defaults].

[models.t1_ir.default]
