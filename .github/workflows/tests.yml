name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build browser assets for launch tests
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Run tests
        run: |
          python -m coverage run -m pytest
          python -m coverage report

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lint tools
        run: python -m pip install -e ".[dev]"
      - name: Run static checks
        run: |
          python -m ruff check mrax tests
          python -m isort --check-only mrax tests
          python -m pyright
          python -m compileall -q mrax tests

  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend and locked frontend tools
        run: |
          python -m pip install -e ".[dev]"
          npm ci --prefix frontend
      - name: Install test browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify frontend and API contract
        working-directory: frontend
        run: |
          npm run lint
          npm run format:check
          npm run verify:schema
          npm run build
      - name: Run synthetic browser workflows
        working-directory: frontend
        run: npm test
      - name: Build and qualify the installed wheel
        shell: bash
        run: |
          python -m build --wheel
          python tests/qualify_distribution.py dist
          python -m venv --system-site-packages .wheel-env
          if [ "$RUNNER_OS" = "Windows" ]; then
            wheel_python=.wheel-env/Scripts/python.exe
          else
            wheel_python=.wheel-env/bin/python
          fi
          "$wheel_python" -m pip install --no-deps --force-reinstall dist/*.whl
          "$wheel_python" -I tests/qualify_browser_install.py --device cpu
