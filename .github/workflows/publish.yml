name: Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install release validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs]"
      - name: Build and check browser assets
        run: |
          npm ci --prefix frontend
          npm run lint --prefix frontend
          npm run format:check --prefix frontend
          npm run verify:schema --prefix frontend
          npm run build --prefix frontend
      - name: Validate source
        run: |
          python -m ruff check mrax tests
          python -m isort --check-only mrax tests
          python -m pyright
          python -m coverage run -m pytest
          python -m coverage report
          sphinx-build -W --keep-going -E -b html docs /tmp/mrax-release-docs
      - name: Verify GUI workflows
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium firefox webkit
          npm test
      - name: Build and inspect distribution
        run: |
          python -m build
          python -m twine check dist/*
          python tests/qualify_distribution.py dist
          python -m venv --system-site-packages /tmp/mrax-release-wheel
          /tmp/mrax-release-wheel/bin/python -m pip install --no-deps --force-reinstall dist/*.whl
          /tmp/mrax-release-wheel/bin/python -I tests/qualify_browser_install.py --device cpu
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
